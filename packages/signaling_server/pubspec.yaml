name: signaling_server
description: >
  Stateless WebSocket signaling relay for PeerTFT. Matches two clients on a
  shared room code and forwards their WebRTC offer/answer/ICE messages
  verbatim; it never sees file content and keeps no persistent storage.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  shared:
    path: ../shared
  shelf: ^1.4.1
  shelf_web_socket: ^2.0.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  fake_async: ^1.3.1
  lints: ^4.0.0
  test: ^1.25.0
