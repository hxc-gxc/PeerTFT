# nginx:alpine's default /etc/nginx/mime.types maps .woff/.woff2/.eot but not
# .otf/.ttf. Flutter web ships its icon fonts (MaterialIcons-Regular.otf) as
# .otf, so without this they're served as application/octet-stream -- most
# browsers still load them as fonts regardless, but some (notably Safari) can
# refuse to, causing icons that render fine in `flutter run` (which serves
# correct MIME types) to silently disappear in this container's build.
types {
    font/otf  otf;
    font/ttf  ttf;
}
