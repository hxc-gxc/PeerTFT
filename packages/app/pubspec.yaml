name: app
description: PeerTFT client — chunked file transfer over WebRTC DataChannel.
version: 0.2.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  shared:
    path: ../shared
  flutter_webrtc: ^1.6.1
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  flutter_riverpod: ^2.6.1
  file_picker: ^12.2.0
  qr_flutter: ^4.1.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
