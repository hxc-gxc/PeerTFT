name: peertft_workspace

environment:
  sdk: ^3.12.2

dev_dependencies:
  melos: ^8.6.0

workspace:
  - packages/app
  - packages/shared
  - packages/signaling_server

melos:
  command:
    bootstrap:
      runPubGetInParallel: true

  scripts:
    analyze:
      exec:
        command: dart analyze .
        concurrency: 1
      packageFilters:
        dirExists: lib
      description: Run static analysis on every package.

    test:
      exec:
        command: dart test
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Run tests on every package that has one.

    format:
      run: dart format --set-exit-if-changed .
      description: Check formatting across the whole workspace.
