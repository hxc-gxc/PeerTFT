name: peertft_workspace

environment:
  sdk: ^3.12.2

dev_dependencies:
  melos: ^8.6.0

workspace:
  - packages/app
  - packages/shared
  - packages/signaling_server

melos:
  command:
    bootstrap:
      runPubGetInParallel: true

  scripts:
    analyze:
      exec:
        command: dart analyze .
        concurrency: 1
      packageFilters:
        dirExists: lib
      description: Run static analysis on every package.

    test:
      exec:
        command: dart test
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: false
      description: Run tests on pure-Dart packages.

    test:flutter:
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: true
      description: Run tests on Flutter packages.

    format:
      exec: dart format --set-exit-if-changed .
      description: Check formatting across the whole workspace.
