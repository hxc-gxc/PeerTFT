name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Install melos
        run: dart pub global activate melos 8.6.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Format
        run: melos run format
      - name: Analyze
        run: melos run analyze
      - name: Test (Dart)
        run: melos run test
      - name: Test (Flutter)
        run: melos run test:flutter

  build-signaling-image:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push signaling image
        run: |
          docker build \
            -f packages/signaling_server/Dockerfile \
            -t ghcr.io/hxc-gxc/peertft-signaling:latest \
            -t ghcr.io/hxc-gxc/peertft-signaling:${{ github.sha }} \
            .
          docker push ghcr.io/hxc-gxc/peertft-signaling:latest
          docker push ghcr.io/hxc-gxc/peertft-signaling:${{ github.sha }}

  build-web-image:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        run: |
          docker build \
            -f packages/app/Dockerfile.web \
            --build-arg SIGNALING_WS_URL=wss://signal.noredflag.fr/ws \
            --build-arg SIGNALING_HTTP_URL=https://signal.noredflag.fr \
            --build-arg STUN_URL=stun:signal.noredflag.fr:3478 \
            -t ghcr.io/hxc-gxc/peertft-web:latest \
            -t ghcr.io/hxc-gxc/peertft-web:${{ github.sha }} \
            .
          docker push ghcr.io/hxc-gxc/peertft-web:latest
          docker push ghcr.io/hxc-gxc/peertft-web:${{ github.sha }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Install melos
        run: dart pub global activate melos 8.6.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Build APK
        working-directory: packages/app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: packages/app/build/app/outputs/flutter-apk/app-debug.apk

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Install melos
        run: dart pub global activate melos 8.6.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Create Linux project files
        working-directory: packages/app
        run: flutter create --platforms=linux .
      - name: Build Linux
        working-directory: packages/app
        run: flutter build linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: packages/app/build/linux/x64/release/bundle/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Install melos
        run: dart pub global activate melos 8.6.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Create macOS project files
        working-directory: packages/app
        run: flutter create --platforms=macos .
      - name: Build macOS
        working-directory: packages/app
        run: flutter build macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: packages/app/build/macos/Build/Products/Release/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Install melos
        run: dart pub global activate melos 8.6.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Create Windows project files
        working-directory: packages/app
        run: flutter create --platforms=windows .
      - name: Build Windows
        working-directory: packages/app
        run: flutter build windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: packages/app/build/windows/x64/runner/Release/

  deploy:
    needs: [lint, build-signaling-image, build-web-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        run: |
          curl -f -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}'
